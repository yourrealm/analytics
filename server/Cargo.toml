[package]
name = "analytics"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.23"
blake3 = "1"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }
maxminddb = { version = "0.32", features = ["mmap"] }
ring = "0.17"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
ureq = { version = "3.4", features = ["json"] }
url = "2.5"

# Size over speed: this binary idles forever on the box.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
