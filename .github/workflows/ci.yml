name: CI

# `container` checks the Rust server. `web` checks realm.tsx with the Realm
# SDK from npm and typechecks and builds the React dashboard. `e2e` runs
# Liwan's tracker and the dashboard in Chromium against the server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monthly: rebuild the image so it carries the latest DB-IP data.
  schedule:
    - cron: "0 6 3 * *"

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Server
        working-directory: server
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check realm.tsx and the dashboard
        run: |
          pnpm install --frozen-lockfile
          deno fmt --check
          deno check
          pnpm exec realm-sdk test
          pnpm exec realm-sdk build --out dist/analytics.realmpack
          pnpm exec tsc -p web
          pnpm build:web

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Tracker and dashboard in Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm geoip
          pnpm test:e2e
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  # The image, pushed to GHCR on main with the workflow's own token. The box
  # pulls ghcr.io/yourrealm/analytics:latest, so the package must be public.
  publish:
    needs: [container, web, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
